[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "agcli"
version = "0.1.0"
description = "Python bindings for the agcli Bittensor SDK"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.maturin]
manifest-path = "agcli-py/Cargo.toml"
python-source = "."
module-name = "agcli._agcli"
features = ["pyo3/extension-module"]
include = ["agcli/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: tests that require live chain connectivity",
]
