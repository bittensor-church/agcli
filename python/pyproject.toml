[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "agcli"
version = "0.1.0"
description = "Python bindings for the agcli Bittensor SDK"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/unarbos/agcli"
Documentation = "https://github.com/unarbos/agcli/tree/main/docs"
Repository = "https://github.com/unarbos/agcli"
Issues = "https://github.com/unarbos/agcli/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.maturin]
manifest-path = "agcli-py/Cargo.toml"
python-source = "."
module-name = "agcli._agcli"
features = ["pyo3/extension-module"]
include = ["agcli/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: tests that require live chain connectivity",
    "localnet: tests that require a local subtensor node",
]
