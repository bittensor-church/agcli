name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  METADATA_CHAIN_ENDPOINT: wss://entrypoint-finney.opentensor.ai:443
  NEXTEST_PROFILE: ci

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        # Same integration crates as the nextest job (avoid `--tests`: pulls proptest/stress + full `#[cfg(test)]` clippy).
        run: >-
          cargo clippy --lib --bins
          --test wallet_test --test cli_weights
          --test cli_test --test helpers_test
          -- -D warnings

  python-clippy:
    name: Python clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - name: Clippy agcli-py
        run: cargo clippy -p agcli-py --no-deps --features pyo3/extension-module -- -D warnings

  sdk-only:
    name: SDK-only check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - name: Clippy sdk-only feature
        run: cargo check --no-default-features --features sdk-only

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: >-
          cargo nextest run --lib
          --test wallet_test --test cli_weights
          --test cli_test --test helpers_test
        timeout-minutes: 25

  coverage:
    name: Coverage
    # Same tests as `test` but with llvm-cov instrumentation — skip on PRs to save ~15–25 min.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Generate coverage
        run: >-
          cargo llvm-cov nextest --lib
          --test wallet_test --test cli_weights
          --test cli_test --test helpers_test
          --codecov --output-path codecov.json
        timeout-minutes: 25
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
          use_oidc: true

  build:
    name: Build Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - name: Build release binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: agcli-linux-amd64
          path: target/release/agcli

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0" pytest pytest-asyncio
      - name: Build extension
        run: maturin build --manifest-path python/agcli-py/Cargo.toml --out python/dist
        env:
          METADATA_CHAIN_ENDPOINT: wss://entrypoint-finney.opentensor.ai:443
      - name: Install package (editable)
        working-directory: python
        run: pip install -e ".[dev]"
        env:
          METADATA_CHAIN_ENDPOINT: wss://entrypoint-finney.opentensor.ai:443
      - name: Run Python tests
        working-directory: python
        run: pytest -m "not network and not localnet"
        env:
          METADATA_CHAIN_ENDPOINT: wss://entrypoint-finney.opentensor.ai:443

  wheels:
    name: Wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-target-cache
          workspaces: |
            . -> target
            python/agcli-py -> target
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"
      - name: Build wheels
        working-directory: python
        run: maturin build --release --strip --manifest-path agcli-py/Cargo.toml --out dist
        env:
          METADATA_CHAIN_ENDPOINT: wss://entrypoint-finney.opentensor.ai:443
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: python/dist/*.whl
